space:

  # ---------------------------------------------------------------------
  # Geometry
  # ---------------------------------------------------------------------
  # Geometry is a property of each SECTOR (chosen at creation); this is
  # just the default for new sectors. It cannot be a per-view toggle:
  # distance, facing and firing arcs are all computed from it, so a sector
  # rendered as squares in telnet and hexes on the web would be two
  # different games. Both renderers draw whatever the sector actually uses.
  #
  #   square - 8 facings (N/NE/E/SE/S/SW/W/NW), Chebyshev distance
  #   hex    - 6 facings (NE/E/SE/SW/W/NW), axial coordinates
  default_geometry: square

  # Square geometry only. Where the diagonal directions fall when splitting
  # 8 facings into 4 arcs:
  #   forward   - wide bow/stern arcs (good for fixed-gun fighters)
  #   broadside - wide port/starboard arcs (good for capital broadsides)
  arc_diagonal_bias: forward

  # ---------------------------------------------------------------------
  # Resolution model
  # ---------------------------------------------------------------------
  # banked     - pilot rolls once per round, successes defend against every
  #              attack that round (POC default: one pilot action per round)
  # per_attack - pilot rolls fresh against each incoming attack (not yet
  #              implemented; the resolver dispatches on this key)
  evade_model: banked

  # false - GM runs space/resolve
  # true  - the round resolves as soon as every crewed ship has orders
  auto_resolve: false

  # Net successes (attack successes minus target's evade margin) needed to hit.
  hit_threshold: 1

  # Dice rolled when a station's skill is unset, unknown to the dice
  # system, or the station is crewed by an unskilled hand.
  untrained_dice: 2

  # ---------------------------------------------------------------------
  # Dice system
  # ---------------------------------------------------------------------
  # Which system crew rolls go out to. `fs3` is core FS3 and the default -
  # leave this alone unless your game runs something else.
  #
  # Everything else in this plugin (ships, arcs, sections, silhouette, the
  # round structure) is system-agnostic; only the dice are not. A game on
  # another system supplies an adapter - four small methods - and names it
  # here. A bare name is one shipped with this plugin; a name containing
  # "::" is a fully-qualified constant, so an adapter can live inside your
  # own plugin. See docs/architecture.md for the contract.
  #
  # Run `manage/checkconfig` after changing this: it reports an unknown
  # name, a half-implemented adapter, and any station skill the system
  # doesn't actually define.
  dice_system: fs3

  # ---------------------------------------------------------------------
  # Silhouette (size class)
  # ---------------------------------------------------------------------
  # To-hit modifier is (target silhouette - attacker silhouette), clamped
  # to +/- this value. Big targets are easy; small ones are hard.
  silhouette_tohit_clamp: 3

  scale_rules:
    # Fighter-scale weapons do full damage up to this silhouette.
    fighter_weapon_full_damage_max_silhouette: 5
    # ...and against anything larger:
    #   systems_only - can damage sections/systems but never core hull
    #   reduced      - full damage pool multiplied by the value below
    fighter_weapon_vs_larger: systems_only
    fighter_weapon_reduced_multiplier: 0.5
    # Capital-scale weapons track poorly against small, nimble targets.
    capital_weapon_min_silhouette: 5
    capital_weapon_small_target_penalty: -3

  # ---------------------------------------------------------------------
  # Range
  # ---------------------------------------------------------------------
  range_mods:
    point_blank: 1      # within half the weapon's range
    normal: 0           # within the weapon's range
    # Beyond a weapon's range it simply cannot fire.

  # ---------------------------------------------------------------------
  # Stations -> abilities
  # ---------------------------------------------------------------------
  # These default to skills that ship with stock FS3, so the plugin works
  # out of the box. Change them to whatever this game's skill list
  # actually contains - if you changed dice_system above, these must be
  # names THAT system defines. An ability the system doesn't know falls
  # back to untrained_dice - run `manage/checkconfig` and this plugin will
  # name any station that would.
  station_skills:
    pilot: Piloting
    helm: Piloting
    gunnery: Gunnery
    engineering: Technician
    sensors: Alertness
    flight_ops: Composure

  # ---------------------------------------------------------------------
  # Sensors
  # ---------------------------------------------------------------------
  sensors:
    # Contacts inside this range are detected automatically each round.
    passive_range: 6
    # An active sweep (Sensors roll) can resolve contacts out to here.
    active_range: 12

  # ---------------------------------------------------------------------
  # Damage
  # ---------------------------------------------------------------------
  damage:
    # A section whose hull hits 0 knocks out the systems mounted in it.
    # A ship is destroyed when this fraction of its total hull is gone.
    destruction_hull_fraction: 1.0
    # Shields regenerate this much per round when not fired upon.
    shield_regen: 1

  # ---------------------------------------------------------------------
  # Strain
  # ---------------------------------------------------------------------
  # A whole-ship "stressed, not broken" pool, separate from the per-section
  # shields/hull above - see docs/architecture.md. A ship whose strain
  # reaches its class's strain_threshold (space_ships.yml; defaults off
  # silhouette when unset) goes adrift: no movement or attacks until it
  # drops back below threshold. Engineering and sensors keep working while
  # adrift - that's exactly when you want the engineer at it.
  strain:
    # Recovered passively each round, same shape as damage.shield_regen.
    regen: 1
    # Strain added to the acting ship when a roll botches (successes < 0).
    # Deliberately set ABOVE regen: both apply every round, so a value
    # equal to regen would cancel out exactly on the common case of one
    # botch in a round, leaving strain unable to accumulate at all and
    # defeating the point of a botch source in the first place. At 2,
    # one bad round nets +1 that sticks unless something recovers it
    # faster - passive regen on a clean round, or a deliberate
    # engineering vent. Set to 0 if this game's dice system never
    # produces negative successes and you'd rather strain stay purely an
    # adapter-driven (e.g. FFG) concern.
    on_botch: 2

  # ---------------------------------------------------------------------
  # Terrain
  # ---------------------------------------------------------------------
  # sensor_mod  - dice modifier when detecting something inside it
  # targeting_mod - dice modifier when shooting into or out of it
  # symbol      - how it draws on the ASCII tactical display
  terrain_types:
    asteroid_field:
      label: Asteroid Field
      symbol: "*"
      sensor_mod: -2
      targeting_mod: -1
    debris:
      label: Debris
      symbol: ":"
      sensor_mod: -1
      targeting_mod: -1
    wreck:
      label: Wreck
      symbol: "#"
      sensor_mod: -1
      targeting_mod: 0
    resource_zone:
      label: Resource Zone
      symbol: "%"
      sensor_mod: 0
      targeting_mod: 0
    dust:
      label: Dust Cloud
      symbol: "~"
      sensor_mod: -3
      targeting_mod: -2
