space:

  # =====================================================================
  # Astrography
  # =====================================================================
  # Star systems are static worldbuilding, so they live here rather than
  # in Redis. Who *controls* a body does change, so that's stored in the
  # database with the `faction` below as the starting value - see
  # `space/claim`.
  #
  # A system is NOT a sector. A sector is the tactical grid where combat
  # happens (squares a fighter crosses in a round); a system is billions
  # of km across. Sectors anchor to a body in a system via `space/anchor`,
  # and the system map then shows where the shooting is.
  # =====================================================================

  # How a body's classification draws, and what the legend says. Add your
  # own; the legend on the web map is generated from this list.
  body_classes:
    scorched:
      label: too hot for human use
      fill: "#fdecea"
      stroke: "#d9534f"
    terraformable:
      label: terraformable candidate
      fill: "#eaf6ea"
      stroke: "#5cb85c"
    unexplored:
      label: outer system, unexplored
      fill: "#f0f0f0"
      stroke: "#9a9a9a"
    belt:
      label: asteroid field
      fill: "#eeeeee"
      stroke: "#b0b0b0"
    wreck:
      label: derelict
      fill: "#f6efe6"
      stroke: "#b58a53"
    station:
      label: station
      fill: "#e9f1fb"
      stroke: "#4a80c0"

  # Faction control draws as a halo ring around a body, so classification
  # and control are both readable at once.
  faction_colors:
    UCC: "#3b7dd8"
    Swarm: "#c0504d"
    Derelict: "#8a8a8a"
    Unclaimed: null      # null = no halo drawn

  # Layout of the orbital rings, in SVG units.
  orbit_layout:
    inner_radius: 70     # radius of ring 1
    ring_step: 46        # spacing between rings
    ring_curve: 0.92     # <1 gently compresses the outer rings inward
    # Each body's `size` below is relative - how big this world is next to
    # its neighbours. These two turn that into something legible on a
    # canvas a thousand units across; raise them if the map reads small.
    body_scale: 2.4      # multiplies a body's `size` when drawn
    label_size: 22       # body and ship labels, in the same canvas units
    # margin: 88         # blank border outside the last ring; defaults to
                         # label_size * 4, which is enough for a long name
                         # on the outermost orbit not to be clipped

  systems:

    covenant_reach:
      name: Covenant's Reach
      description: >
        The system the Covenant was aimed at, and the one it is now
        stranded in. Fourteen worlds, two belts, and a swarm that got
        here first.
      star:
        name: Reach
        spectral: G
        radius: 26
      rings: 16

      bodies:

        - key: p1
          name: P1
          type: planet
          classification: scorched
          ring: 1
          angle: 8
          size: 5
          faction: Unclaimed
          description: A cinder. Tide-locked, atmosphere long since boiled off.

        - key: p2
          name: P2
          type: planet
          classification: scorched
          ring: 2
          angle: 34
          size: 6
          faction: Unclaimed
          description: Molten dayside, metal-rich crust. Mining would kill you.

        - key: p3
          name: P3
          type: planet
          classification: terraformable
          ring: 3
          angle: 62
          size: 9
          faction: Swarm
          callout: swarm-held, the target world
          description: >
            The world the Covenant crossed the dark for. Breathable within
            a generation of work - and already occupied.

        - key: p3_moon
          name: Sentinel
          type: moon
          classification: unexplored
          parent: p3
          moon_orbit: 22
          angle: 210
          size: 3
          faction: Unclaimed
          description: P3's single moon. Something on it is still transmitting.

        - key: inner_belt
          name: Inner Belt
          type: belt
          classification: belt
          ring: 5
          size: 4
          faction: Unclaimed
          description: Dense, metal-rich, and a good place to lose a pursuer.

        - key: p4
          name: P4
          type: planet
          classification: terraformable
          ring: 4
          angle: 96
          size: 8
          faction: Unclaimed
          callout: unexplored, the backup candidate
          description: >
            Colder and drier than P3, but nothing lives there. If P3
            cannot be taken, this is the fallback.

        - key: concord
