  # =====================================================================
  # Travel
  # =====================================================================
  # A ship's normal position is a body in a system - orbiting P3, docked
  # at the Concord, holding in the belt. Sectors are only spun up when
  # there's a fight.
  #
  # Travel resolves lazily: departure time and duration are stored, and
  # arrival is worked out whenever anyone looks. No scheduler, no
  # background task, consistent with the rest of the plugin.
  travel:
    # Seconds per orbital ring crossed, before the hull's speed is applied.
    seconds_per_ring: 180
    # Minimum trip time, so hopping to the next ring still takes a moment.
    minimum_seconds: 60
    # A hull's `speed` stat divides the trip time; this is the speed that
    # counts as "par". A Talon (speed 4) is twice as fast as par 2.
    par_speed: 2
    # Ships can't set course while an engagement is running in their sector.
    block_during_combat: true
